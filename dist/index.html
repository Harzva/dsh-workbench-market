<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="按名称、用途或仓库搜索 DSH 工作台，浏览 Dataelem 原生和 DSH Web 的公开项目。">
  <title>DSH 工作台市场</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./catalog.js" defer></script>
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="frame header-inner">
      <a class="brand" href="./index.html">DSH 工作台市场</a>
      <nav aria-label="相关资源">
        <a href="https://github.com/Harzva/dsh-workbench-market/blob/main/docs/workbench-definition.md">收录标准 ↗</a>
        <a href="https://github.com/Harzva/dsh-workbench-market">GitHub ↗</a>
        <a href="https://www.dshdesktop.com/tutorials/guide-workbench-install.html">安装指南 ↗</a>
      </nav>
    </div>
  </header>
  <main class="frame">
    <div class="catalog-heading">
      <h1>发现 DSH 工作台</h1>
      <p class="intro">搜索适用于 Dataelem DSH Desktop、DSH Web 或 DeepSeek 官方桌面版的工作台。</p>
    </div>
    <search aria-label="搜索和筛选工作台">
      <form id="filters" method="get">
        <div class="query">
          <label for="query">搜索工作台</label>
          <input type="search" id="query" name="q" placeholder="例如 资源管理器、OCR、projectHub" autocomplete="off" autocapitalize="none" spellcheck="false">
        </div>
        <div>
          <label for="source">工作台类型</label>
          <select id="source" name="source">
            <option value="">全部类型</option>
            <option value="official">Dataelem 市场收录</option>
            <option value="registered">Dataelem · 已核对注册</option>
            <option value="dataelem-extension">Dataelem · 会话扩展</option>
            <option value="web">DSH Web · 已核对</option>
            <option value="deepseek-desktop">DeepSeek 官方桌面 · 已核对</option>
            <option value="manifest">Dataelem · 清单候选</option>
          </select>
        </div>
        <div>
          <label for="category">分类</label>
          <select id="category" name="category"><option value="">全部分类</option></select>
        </div>
        <button type="reset" class="reset">清除筛选</button>
      </form>
    </search>
    <noscript><p>请启用 JavaScript 搜索工作台，或打开<a href="https://github.com/dataelement/awesome-dsh-workbench">官方目录</a>。</p></noscript>
    <section aria-label="工作台列表">
      <div class="list-header">
        <p id="result-status" role="status"></p>
        <div class="results-tools">
          <label class="preview-filter"><input id="with-preview" form="filters" type="checkbox"> 只看有截图</label>
          <div id="view-options" role="group" aria-label="浏览视图" hidden>
            <button type="button" class="view-button" data-view="thumbnail" aria-pressed="true">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="m2 10 3.5-3 3 3 2-2 3.5 3"/><circle cx="10.5" cy="5.5" r=".7" fill="currentColor" stroke="none"/></svg>
              缩略图
            </button>
            <button type="button" class="view-button" data-view="list" aria-pressed="false">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 4h8M6 8h8m-8 4h8M2 4h1M2 8h1m-1 4h1"/></svg>
              列表
            </button>
            <button type="button" class="view-button" data-view="grid" aria-pressed="false">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor"><rect x="2" y="2" width="4.5" height="4.5" rx=".7"/><rect x="9.5" y="2" width="4.5" height="4.5" rx=".7"/><rect x="2" y="9.5" width="4.5" height="4.5" rx=".7"/><rect x="9.5" y="9.5" width="4.5" height="4.5" rx=".7"/></svg>
              网格
            </button>
          </div>
        </div>
      </div>
      <p id="empty" hidden>没有匹配的工作台。可以换个关键词或清除筛选。</p>
      <ul id="results" data-view="thumbnail"></ul>
    </section>
    <footer>条目附有来源或源码证据。版本兼容性以相应宿主的实测为准。
      <time id="date"></time>
      <a href="https://market.dshdesktop.com/index.json">Dataelem 索引 ↗</a>
      <a href="./index.json">目录 JSON ↗</a>
    </footer>
  </main>
  <template id="listing">
    <li class="listing">
      <div class="listing-media">
        <a class="listing-preview" data-preview hidden target="_blank" rel="noreferrer">
          <img alt="" decoding="async" referrerpolicy="no-referrer">
        </a>
        <span class="preview-placeholder">暂无截图</span>
      </div>
      <div class="listing-main">
        <h2><a data-title></a></h2>
        <p data-description class="description"></p>
        <p data-repo class="repo"></p>
      </div>
      <div class="listing-meta">
        <div class="meta-line"><span data-source class="status"></span><span data-category></span><span data-version></span></div>
        <div class="evidence"><a data-manifest>插件清单 ↗</a><a data-registration>注册代码 ↗</a><a data-workflow>工作流依据 ↗</a><a data-preview-source hidden target="_blank" rel="noreferrer">界面截图 ↗</a></div>
      </div>
    </li>
  </template>
</body>
</html>
